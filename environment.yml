# Training/generation environment. Requires an NVIDIA driver supporting CUDA 12.1.
# Python and primary package versions follow the recorded training environment.
name: bridge-ad
channels:
  - defaults
dependencies:
  - python=3.10.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - diffusers==0.21.1
      - transformers==4.29.2
      - accelerate==0.33.0
      - safetensors==0.7.0
      - numpy==1.24.3
      - scipy==1.15.3
      - pandas==1.5.3
      - Pillow==11.3.0
      - opencv-python==4.8.1.78
      - lpips==0.1.4
      - PyYAML==6.0.3
      # Compatibility pin for diffusers 0.21.1; not captured in the original snapshot.
      - huggingface-hub==0.25.2
